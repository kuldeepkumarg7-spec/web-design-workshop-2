<!DOCTYPE html>
<html>
<head>
<title>Counter App</title>

<script src="index.js"></script>
<style>
body{shgsh
    font-family: Verdana;
    
    display:flex;
    justify-content:center;
    align-items:center;
    height:100px;
}

.container{
    background:#ffffff;
    padding:35px;
    border-radius:15px;
    text-align:center;
    width:300px;
    
}

h2{
    color:#444;
}

#count{
    font-size:42px;
    color:#333;
    margin:20px ;
}

button{
    padding:10px 18px;
    margin:8px;
    border:none;
    border-radius:8px;
    font-size:15px;
    cursor:pointer;
}

.inc{
    background:#28a745;
    color:white;
}

.dec{
    background:#e74c3c;
    color:white;
}

.reset{
    background:#6f42c1;
    color:white;
}

button:hover{
    opacity:2px;
}
</style>
</head>

<body>

<div class="container">
    <h2>Simple Counter</h2>

    <div id="count">0</div>

    <button class="inc" onclick="increment()">Increase</button>
    <button class="dec" onclick="decrement()">Decrease</button>
    <br>
    <button class="reset" onclick="reset()">Reset Counter</button>
</div>


</body>
</html>
